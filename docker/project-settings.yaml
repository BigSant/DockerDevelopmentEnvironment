# Resolve scalar project settings with Compose's dotenv parser, not a shell.
services:
  settings:
    image: scratch
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      PROJECT_DISPLAY_NAME: ${PROJECT_DISPLAY_NAME-}
      EXTRA_COMPOSE_FILES: ${PROJECT_COMPOSE_FILES-}
      # Names (not values) of the application's own settings that php-fpm and cron receive.
      APP_ENVIRONMENT: ${APP_ENVIRONMENT-}
      DATABASE_NAME: ${DATABASE_NAME-}
      DATABASE_USER: ${DATABASE_USER-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD-}
      DATABASE_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD-}
      DATABASE_EXTRA_SCHEMAS: ${DATABASE_EXTRA_SCHEMAS-}
      TZ: ${TZ-}
      XDEBUG_MODE: ${XDEBUG_MODE-}
      PS_VERSION: ${PS_VERSION-}
      PS_RELEASE: ${PS_RELEASE-}
      PS_RELEASE_PATHS: ${PS_RELEASE_PATHS-}
      PS_ADMIN_DIR: ${PS_ADMIN_DIR-}
      PS_DATABASE_PREFIX: ${PS_DATABASE_PREFIX-}
      PS_COOKIE_KEY: ${PS_COOKIE_KEY-}
      TEST_COPY_EXCLUDE: ${TEST_COPY_EXCLUDE-}
      APP_UID: ${APP_UID-}
      APP_GID: ${APP_GID-}
      DEPLOY_CONTEXT: ${DEPLOY_CONTEXT-}
      DEPLOY_PATH: ${DEPLOY_PATH-}
      DEPLOY_SSH: ${DEPLOY_SSH-}
      DEPLOY_PROTECTED_PATHS: ${DEPLOY_PROTECTED_PATHS-}
      DEPLOY_PHP_RELOAD: ${DEPLOY_PHP_RELOAD-}
      PHP_VERSION: ${PHP_VERSION-}
      MYSQL_VERSION: ${MYSQL_VERSION-}
      MARIADB_VERSION: ${MARIADB_VERSION-}
      DATABASE_ENGINE: ${DATABASE_ENGINE-}
      SETUP_COMPATIBILITY_CHECK: ${SETUP_COMPATIBILITY_CHECK-}
      DOMAIN: ${DOMAIN-}
      SQL_DOMAIN: ${SQL_DOMAIN-${DOMAIN-}}
      PROFILE: ${PROFILE-}
      LOCALHOST_PORT: ${LOCALHOST_PORT-0}
      LOCALHOST_PORT_SSL: ${LOCALHOST_PORT_SSL-0}
      # Host address nginx-proxy publishes both ports on; empty = 127.0.0.1 (behind DirectAdmin / the host Nginx).
      PUBLISH_ADDRESS: ${PUBLISH_ADDRESS-}
      DATA_DIRECTORY: ${DATA_DIRECTORY-}
      APP_SOURCE_DIRECTORY: ${APP_SOURCE_DIRECTORY-}
      SCHEMA_DIRECTORY: ${SCHEMA_DIRECTORY-}
      POST_IMPORT_SQL_DIRECTORY: ${POST_IMPORT_SQL_DIRECTORY-}
      FIXTURES_DIRECTORY: ${FIXTURES_DIRECTORY-}
      PHPSTAN_BASELINE_FILE: ${PHPSTAN_BASELINE_FILE-}
      PLAYWRIGHT_COMMAND: ${PLAYWRIGHT_COMMAND-npx playwright test}
      CACHE_CLEAR_COMMAND: ${CACHE_CLEAR_COMMAND-}
      PROFILES: ${COMPOSE_PROFILES-}
      SERVICES: ${SERVICES-}
      ALLOWED_IPS: ${ALLOWED_IPS-}
      SITE_ALLOWED_IPS: ${SITE_ALLOWED_IPS-}
      PMA_ALLOWED_IPS: ${PMA_ALLOWED_IPS-}
      MAILPIT_ALLOWED_IPS: ${MAILPIT_ALLOWED_IPS-}
      CRON_ALLOWED_IPS: ${CRON_ALLOWED_IPS-}
      DBMONITOR_ALLOWED_IPS: ${DBMONITOR_ALLOWED_IPS-}
      METRICS_ALLOWED_IPS: ${METRICS_ALLOWED_IPS-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES-}
      TRUSTED_PROXIES_DIRECT: ${TRUSTED_PROXIES_DIRECT-}
      CRON_HISTORY_KEEP: ${CRON_HISTORY_KEEP-}
      CACHE_MODE: ${CACHE_MODE-auto}
      PHP_OPCACHE: ${PHP_OPCACHE-auto}
      PHP_APCU: ${PHP_APCU-auto}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS-auto}
      PHP_OPCACHE_REVALIDATE_FREQ: ${PHP_OPCACHE_REVALIDATE_FREQ-0}
      PS_SMARTY_CACHE: ${PS_SMARTY_CACHE-auto}
      PS_SMARTY_COMPILE: ${PS_SMARTY_COMPILE-auto}
      PS_ASSET_CACHE: ${PS_ASSET_CACHE-auto}
      PS_OBJECT_CACHE: ${PS_OBJECT_CACHE-auto}
      MAIL_MODE: ${MAIL_MODE-auto}
      PS_SSL: ${PS_SSL-}
      INTEGRATIONS_ENABLED: ${INTEGRATIONS_ENABLED-}
      HTTP_FORCE_HTTPS: ${HTTP_FORCE_HTTPS-auto}
      PS_DEBUG_MODE: ${PS_DEBUG_MODE-}
      PS_DEBUG_IPS: ${PS_DEBUG_IPS-}
      CONTAINER_LOG_MAX_SIZE: ${CONTAINER_LOG_MAX_SIZE-10m}
      CONTAINER_LOG_MAX_FILES: ${CONTAINER_LOG_MAX_FILES-3}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB-1024}
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST-5}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS-500}
      # Container limits per service; empty uses the local default (stage/prod must set the core four).
      PHP_MEMORY: ${PHP_MEMORY-}
      PHP_CPUS: ${PHP_CPUS-}
      DATABASE_MEMORY: ${DATABASE_MEMORY-}
      DATABASE_CPUS: ${DATABASE_CPUS-}
      WEBSERVER_MEMORY: ${WEBSERVER_MEMORY-}
      WEBSERVER_CPUS: ${WEBSERVER_CPUS-}
      PROXY_MEMORY: ${PROXY_MEMORY-}
      PROXY_CPUS: ${PROXY_CPUS-}
      CRON_MEMORY: ${CRON_MEMORY-}
      CRON_CPUS: ${CRON_CPUS-}
      MEMCACHED_MEMORY: ${MEMCACHED_MEMORY-}
      MEMCACHED_CPUS: ${MEMCACHED_CPUS-}
      PMA_MEMORY: ${PMA_MEMORY-}
      PMA_CPUS: ${PMA_CPUS-}
      MAILPIT_MEMORY: ${MAILPIT_MEMORY-}
      MAILPIT_CPUS: ${MAILPIT_CPUS-}
      DBMONITOR_MEMORY: ${DBMONITOR_MEMORY-}
      DBMONITOR_CPUS: ${DBMONITOR_CPUS-}
      METRICS_MEMORY: ${METRICS_MEMORY-}
      METRICS_CPUS: ${METRICS_CPUS-}
      PHP_CONTAINER_MEMORY: ${PHP_CONTAINER_MEMORY-}
      DB_CONTAINER_MEMORY: ${DB_CONTAINER_MEMORY-}
      WEB_CONTAINER_MEMORY: ${WEB_CONTAINER_MEMORY-}
      MEMCACHED_CONTAINER_MEMORY: ${MEMCACHED_CONTAINER_MEMORY-}
      CONTAINER_CPUS: ${CONTAINER_CPUS-}
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN-}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS-}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS-}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS-}
      PHP_FPM_PROCESS_MEMORY: ${PHP_FPM_PROCESS_MEMORY-}
      DATABASE_BUFFER_POOL: ${DATABASE_BUFFER_POOL-}
      DATABASE_PERFORMANCE_SCHEMA: ${DATABASE_PERFORMANCE_SCHEMA-}
      DATABASE_MONITOR_USER: ${DATABASE_MONITOR_USER-}
      DATABASE_MONITOR_PASSWORD: ${DATABASE_MONITOR_PASSWORD-}
      DBMONITOR_TOKEN: ${DBMONITOR_TOKEN-}
      # Target /metrics (SERVICES=metrics): token, probed URLs, probe address, interface, support level, disk test size,
      # HTTP log window (minutes), the size of each HTTP log file the metrics service reads and how often (seconds)
      # the Docker collector reads the containers.
      METRICS_TOKEN: ${METRICS_TOKEN-}
      METRICS_URLS: ${METRICS_URLS-}
      METRICS_PROBE_ADDRESS: ${METRICS_PROBE_ADDRESS-}
      METRICS_NETWORK_INTERFACE: ${METRICS_NETWORK_INTERFACE-}
      METRICS_SUPPORT_LEVEL: ${METRICS_SUPPORT_LEVEL-}
      METRICS_DISK_WRITE_MB: ${METRICS_DISK_WRITE_MB-}
      METRICS_HTTP_WINDOW_MINUTES: ${METRICS_HTTP_WINDOW_MINUTES-}
      METRICS_HTTP_LOG_MB: ${METRICS_HTTP_LOG_MB-}
      METRICS_DOCKER_INTERVAL: ${METRICS_DOCKER_INTERVAL-}
      MEMCACHED_CACHE_MB: ${MEMCACHED_CACHE_MB-}
      REDIS_MAXMEMORY_MB: ${REDIS_MAXMEMORY_MB-}
      REDIS_MEMORY: ${REDIS_MEMORY-}
      REDIS_CPUS: ${REDIS_CPUS-}
