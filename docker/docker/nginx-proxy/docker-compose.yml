services:
  nginx-proxy:
    image: nginx-proxy-${IMAGE_ENV:-${ENV}}-${NGINX_VERSION}${SETUP_IMAGE_SUFFIX_NGINX_PROXY:-}
    container_name: ${PROJECT_NAME}-${ENV}-nginx-proxy-${NGINX_VERSION}
    mem_limit: ${PROXY_MEMORY}
    cpus: ${PROXY_CPUS}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    build:
      labels:
        setup.managed: "1"
        setup.service: nginx-proxy
        setup.fingerprint: ${SETUP_IMAGE_SUFFIX_NGINX_PROXY:-}
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/nginx-proxy/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        NGINX_VERSION: ${NGINX_VERSION}
        ENV: ${BUILD_ENV:-${ENV}}
    command: /usr/local/bin/init.sh '${DOMAIN}' '${WEBSERVICE_TIMEOUT}'
    environment:
      TZ: ${TZ}
      # Available to project *.template drop-ins.
      SETUP_ENV: ${ENV}
      PROJECT_NAME: ${PROJECT_NAME}
      DOMAIN: ${DOMAIN}
      # Every hostname DOMAIN lists (the first is DOMAIN); the site's server_name holds them all.
      SETUP_DOMAIN_HOSTS: ${SETUP_DOMAIN_HOSTS:-}
      SETUP_ENVIRONMENT: ${ENV}
      CACHE_MODE: ${CACHE_MODE:-off}
      SETUP_ENABLE_PMA: ${SETUP_ENABLE_PMA:-0}
      SETUP_ENABLE_MAILPIT: ${SETUP_ENABLE_MAILPIT:-0}
      SETUP_ENABLE_CRON: ${SETUP_ENABLE_CRON:-0}
      SETUP_ENABLE_DBMONITOR: ${SETUP_ENABLE_DBMONITOR:-0}
      SETUP_ENABLE_BACKUP: ${SETUP_ENABLE_BACKUP:-0}
      SETUP_ENABLE_METRICS: ${SETUP_ENABLE_METRICS:-0}
      # Client IP allowlists per web entry point (empty = open locally, tools denied on stage/prod).
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      SITE_ALLOWED_IPS: ${SITE_ALLOWED_IPS:-}
      PMA_ALLOWED_IPS: ${PMA_ALLOWED_IPS:-}
      MAILPIT_ALLOWED_IPS: ${MAILPIT_ALLOWED_IPS:-}
      CRON_ALLOWED_IPS: ${CRON_ALLOWED_IPS:-}
      DBMONITOR_ALLOWED_IPS: ${DBMONITOR_ALLOWED_IPS:-}
      BACKUP_ALLOWED_IPS: ${BACKUP_ALLOWED_IPS:-}
      METRICS_ALLOWED_IPS: ${METRICS_ALLOWED_IPS:-}
      # Basic-auth on top of the allowlist (htpasswd lines; empty = the allowlist alone). Secrets: Deployment
      # variables on stage/prod. A project's own tool sites (PROXY_TOOLS) pass their <NAME>_ALLOWED_IPS and
      # <NAME>_HTPASSWD to this service in the project's compose file.
      PMA_HTPASSWD: ${PMA_HTPASSWD:-}
      MAILPIT_HTPASSWD: ${MAILPIT_HTPASSWD:-}
      CRON_HTPASSWD: ${CRON_HTPASSWD:-}
      BACKUP_HTPASSWD: ${BACKUP_HTPASSWD:-}
      PROXY_TOOLS: ${PROXY_TOOLS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 1 = ports on a non-loopback PUBLISH_ADDRESS: clients connect directly, their X-Forwarded-* are not trusted.
      SETUP_DIRECT_CLIENTS: ${SETUP_DIRECT_CLIENTS:-0}
    volumes:
      - ${PROJECT_DATA_DIRECTORY}/ssl/:/etc/ssl/certs/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/nginx-proxy/:/etc/nginx/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/nginx-proxy/${ENV}/:/etc/nginx/project.d.env/:ro
    # 127.0.0.1 (default): reachable only through the host proxy (local Nginx / DirectAdmin).
    # A non-loopback PUBLISH_ADDRESS (e.g. the VPN interface) serves clients on that network directly.
    ports:
      - ${PUBLISH_ADDRESS:-127.0.0.1}:${LOCALHOST_PORT}:80
      - ${PUBLISH_ADDRESS:-127.0.0.1}:${LOCALHOST_PORT_SSL}:443
    depends_on:
      - webserver
    networks:
      network_app:
        aliases:
          - ${DOMAIN}
