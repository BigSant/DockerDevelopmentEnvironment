# ─── Target /metrics (metrics service) on the main site, HTTP and HTTPS ───────
# Own allow/deny (METRICS_ALLOWED_IPS / ALLOWED_IPS) replaces the site's; the service checks the token.
# Resolved per request: the service may start after this proxy.
location = /metrics {
    include /etc/nginx/setup-access/metrics.conf;
    include /etc/nginx/proxy_params;
    proxy_buffering on;
    proxy_read_timeout 120s;
    resolver 127.0.0.11 valid=10s;
    set $setup_metrics http://metrics:9100;
    proxy_pass $setup_metrics;
}
