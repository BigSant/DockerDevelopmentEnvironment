# ─── Monitoring (setup metrics service): metrics.<domain> ─────────────────────
# Own allow/deny (METRICS_ALLOWED_IPS / ALLOWED_IPS) and optional Basic-auth (METRICS_HTPASSWD) for the pages
# people open; /metrics keeps the allowlist without Basic-auth, because its optional bearer token, checked by the
# service, uses the same Authorization header. A server of its own: scrapes never reach the site's access log.
# Resolved per request: the service may start after this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name metrics.{DOMAIN};
    include /etc/nginx/setup-access/metrics.conf;

    location = /metrics {
        auth_basic off;
        include /etc/nginx/proxy_params;
        proxy_buffering on;
        proxy_read_timeout 120s;
        resolver 127.0.0.11 valid=10s;
        set $setup_metrics http://metrics:9100;
        proxy_pass $setup_metrics;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        resolver 127.0.0.11 valid=10s;
        set $setup_metrics http://metrics:9100;
        proxy_pass $setup_metrics;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name metrics.{DOMAIN};
    include /etc/nginx/setup-access/metrics.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    location = /metrics {
        auth_basic off;
        include /etc/nginx/proxy_params;
        proxy_buffering on;
        proxy_read_timeout 120s;
        resolver 127.0.0.11 valid=10s;
        set $setup_metrics http://metrics:9100;
        proxy_pass $setup_metrics;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        resolver 127.0.0.11 valid=10s;
        set $setup_metrics http://metrics:9100;
        proxy_pass $setup_metrics;
    }
}
