# ─── phpMyAdmin ───────────────────────────────────────────────────────────────
# Resolved per request, so a recreated pma container is found without restarting this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name pma.{DOMAIN} www.pma.{DOMAIN};
    include /etc/nginx/setup-access/pma.conf;
    client_max_body_size 100M;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_pma http://pma;
        proxy_pass $setup_pma;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pma.{DOMAIN} www.pma.{DOMAIN};
    include /etc/nginx/setup-access/pma.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;
    client_max_body_size 100M;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_pma http://pma;
        proxy_pass $setup_pma;
    }
}
