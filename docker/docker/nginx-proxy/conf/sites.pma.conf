# ─── phpMyAdmin ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pma.{DOMAIN} www.pma.{DOMAIN};
    client_max_body_size 100M;

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://pma;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pma.{DOMAIN} www.pma.{DOMAIN};
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;
    client_max_body_size 100M;

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://pma;
    }
}
