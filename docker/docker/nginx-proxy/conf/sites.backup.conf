# ─── Backup UI (setup backup service): the table registry ─────────────────────
# Resolved per request: backup starts after the database is healthy, later than this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name backup.{DOMAIN};
    include /etc/nginx/setup-access/backup.conf;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_backup http://backup:8082;
        proxy_pass $setup_backup;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backup.{DOMAIN};
    include /etc/nginx/setup-access/backup.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_backup http://backup:8082;
        proxy_pass $setup_backup;
    }
}
