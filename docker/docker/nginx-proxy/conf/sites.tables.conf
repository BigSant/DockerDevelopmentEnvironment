# ─── Tables UI (setup tables service): the table registry ─────────────────────
# Resolved per request: tables starts after the database is healthy, later than this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name tables.{DOMAIN};
    include /etc/nginx/setup-access/tables.conf;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_tables http://tables:8082;
        proxy_pass $setup_tables;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tables.{DOMAIN};
    include /etc/nginx/setup-access/tables.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_tables http://tables:8082;
        proxy_pass $setup_tables;
    }
}
