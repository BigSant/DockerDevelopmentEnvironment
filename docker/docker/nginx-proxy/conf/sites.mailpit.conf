# ─── Mailpit (HTTP + WebSocket) ───────────────────────────────────────────────
# Resolved per request, so a recreated mailpit container is found without restarting this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name mailpit.{DOMAIN} www.mailpit.{DOMAIN};
    include /etc/nginx/setup-access/mailpit.conf;

    location / {
        include /etc/nginx/proxy_params;
        # WebSocket upgrade (Mailpit live UI)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        resolver 127.0.0.11 valid=10s;
        set $setup_mailpit http://mailpit:8025;
        proxy_pass $setup_mailpit;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mailpit.{DOMAIN} www.mailpit.{DOMAIN};
    include /etc/nginx/setup-access/mailpit.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    location / {
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        resolver 127.0.0.11 valid=10s;
        set $setup_mailpit http://mailpit:8025;
        proxy_pass $setup_mailpit;
    }
}
