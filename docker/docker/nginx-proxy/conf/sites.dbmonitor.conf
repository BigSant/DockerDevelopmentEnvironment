# ─── DB monitor endpoint (dbmonitor service) ──────────────────────────────────
# Resolved per request: the monitor starts after the database, later than this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name dbmonitor.{DOMAIN};
    include /etc/nginx/setup-access/dbmonitor.conf;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_dbmonitor http://dbmonitor:8081;
        proxy_pass $setup_dbmonitor;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dbmonitor.{DOMAIN};
    include /etc/nginx/setup-access/dbmonitor.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_dbmonitor http://dbmonitor:8081;
        proxy_pass $setup_dbmonitor;
    }
}
