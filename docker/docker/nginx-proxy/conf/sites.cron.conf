# ─── Cron UI (setup cron service) ─────────────────────────────────────────────
# Resolved per request: cron starts after PHP is healthy, later than this proxy.
server {
    listen 80;
    listen [::]:80;
    server_name cron.{DOMAIN};
    include /etc/nginx/setup-access/cron.conf;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_cron http://cron:8080;
        proxy_pass $setup_cron;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cron.{DOMAIN};
    include /etc/nginx/setup-access/cron.conf;
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    location / {
        include /etc/nginx/proxy_params;
        resolver 127.0.0.11 valid=10s;
        set $setup_cron http://cron:8080;
        proxy_pass $setup_cron;
    }
}
