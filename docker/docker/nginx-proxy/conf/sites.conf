# Re-resolved through Docker's DNS (resolve, nginx 1.27.3+): a recreated webserver gets a new address,
# and a name resolved only at start sent every request to the old one (502) until the proxy restarted.
upstream http_backend {
    zone http_backend 64k;
    resolver 127.0.0.11 valid=10s;
    server webserver resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name {DOMAIN};
    server_name www.{DOMAIN};
    # {DOMAIN_HOSTS}: the project's other hostnames (DOMAIN lists several), set by init.sh

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log setup;

    client_max_body_size 100M;

    # Client IP allowlist for the site (SITE_ALLOWED_IPS / ALLOWED_IPS).
    include /etc/nginx/setup-access/site.conf;

    # Setup's own drop-ins for the main site (the metrics service's copy of the access log), rendered by init.sh.
    include /etc/nginx/setup-site.d/*.conf;

    # Per-project server-level drop-ins for the main site.
    include /etc/nginx/project.r/server.d/*.conf;
    include /etc/nginx/project.r.env/server.d/*.conf;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $setup_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_pass http://http_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_connect_timeout 0; #{TIMEOUT}
        proxy_send_timeout 0; #{TIMEOUT}
        proxy_read_timeout 0; #{TIMEOUT}
        send_timeout 0; #{TIMEOUT}

        # Per-project drop-ins for the main location.
        include /etc/nginx/project.r/location.d/*.conf;
        include /etc/nginx/project.r.env/location.d/*.conf;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name {DOMAIN};
    server_name www.{DOMAIN};
    # {DOMAIN_HOSTS}: the project's other hostnames (DOMAIN lists several), set by init.sh

    # Certificates mounted via docker-compose volume (PROJECT_DATA_DIRECTORY/ssl/)
    #   /etc/ssl/certs/domain.crt  ← certificate (+ chain)
    #   /etc/ssl/certs/domain.key  ← private key
    ssl_certificate     /etc/ssl/certs/domain.crt;
    ssl_certificate_key /etc/ssl/certs/domain.key;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log setup;

    client_max_body_size 100M;

    # Client IP allowlist for the site (SITE_ALLOWED_IPS / ALLOWED_IPS).
    include /etc/nginx/setup-access/site.conf;

    # Setup's own drop-ins for the main site (the metrics service's copy of the access log), rendered by init.sh.
    include /etc/nginx/setup-site.d/*.conf;

    # Per-project server-level drop-ins for the main site.
    include /etc/nginx/project.r/server.d/*.conf;
    include /etc/nginx/project.r.env/server.d/*.conf;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $setup_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_pass http://http_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_connect_timeout 0; #{TIMEOUT}
        proxy_send_timeout 0; #{TIMEOUT}
        proxy_read_timeout 0; #{TIMEOUT}
        send_timeout 0; #{TIMEOUT}

        # Per-project drop-ins for the main location.
        include /etc/nginx/project.r/location.d/*.conf;
        include /etc/nginx/project.r.env/location.d/*.conf;
    }
}
