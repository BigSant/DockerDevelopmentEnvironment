services:
  playwright:
    image: playwright-${PLAYWRIGHT_VERSION}${SETUP_IMAGE_SUFFIX_PLAYWRIGHT:-}
    container_name: ${PROJECT_NAME}-${ENV}-playwright
    profiles:
      - playwright
    restart: "no"
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /e2e
    build:
      labels:
        setup.managed: "1"
        setup.service: playwright
        setup.fingerprint: ${SETUP_IMAGE_SUFFIX_PLAYWRIGHT:-}
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/playwright/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION}
    depends_on:
      - webserver
    networks:
      - network_app
    environment:
      BASE_URL: https://${DOMAIN}
      PLAYWRIGHT_TEST_DIR: /e2e/tests
      PLAYWRIGHT_DATA_DIR: /e2e/data
    # e2e runs only in ENV=test: config and specs are shared read-only, results go to the data directory.
    volumes:
      - ${PROJECT_CONFIG_DIRECTORY}/playwright/:/e2e/config/:ro
      - ${PROJECT_APP_DIRECTORY}/tests/playwright/:/e2e/tests/:ro
      - ${PROJECT_DATA_DIRECTORY}/playwright/:/e2e/data/
