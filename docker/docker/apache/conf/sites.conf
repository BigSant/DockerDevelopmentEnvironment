# ── HTTP (nginx handles TLS termination upstream) ─────────────────────────────
<VirtualHost *:80>
    ServerName   DOMAIN_VAR
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{ENV:HTTP_FORCE_HTTPS} =on
    RewriteCond %{HTTP:X-Forwarded-Proto} !^https$ [NC]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=302,L]

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    # Never serve hidden paths (.git, .env, .idea …) except ACME challenges, dumps,
    # backups or Composer manifests; answer as if they did not exist.
    RedirectMatch 404 "(?i)/\.(?!well-known(/|$))"
    RedirectMatch 404 "(?i)\.(sql|sql\.gz|sql\.zip|bak|swp)$"
    RedirectMatch 404 "(?i)/composer\.(json|lock)$"

    <Directory /var/www/html>
        DirectoryIndex index.php index.html
        AllowOverride All
        Options -Indexes
        Require all granted
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://php-fpm:9000/"
        </FilesMatch>
    </Directory>

    # Per-project virtual-host drop-ins (rendered from the project apache config).
    IncludeOptional /usr/local/apache2/conf/project.r/vhost.d/*.conf
    IncludeOptional /usr/local/apache2/conf/project.r.env/vhost.d/*.conf

    ErrorLog  /var/log/apache2/DOMAIN_VAR.error.log
    CustomLog /var/log/apache2/DOMAIN_VAR.access.log combined
</VirtualHost>
