services:
  webserver:
    image: webserver-apache-${ENV}-${APACHE_VERSION}
    container_name: ${PROJECT_NAME}-${ENV}-webserver-apache-${APACHE_VERSION}
    restart: unless-stopped
    build:
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/apache/Dockerfile
      target: env-${ENV}
      args:
        PROFILE: ${PROFILE}
        APACHE_VERSION: ${APACHE_VERSION}
    command: /usr/local/bin/init.sh '${DOMAIN}' '${DOCUMENT_ROOT}' '${ENV}'
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - network_app
    volumes:
      - ${PROJECT_WEB_DIRECTORY}:/var/www/html/
      - ${PROJECT_DATA_DIRECTORY}/ssl/:/etc/ssl/certs/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/apache/:/usr/local/apache2/conf/project/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/apache/${ENV}/:/usr/local/apache2/conf/project.env/:ro
