services:
  # With SERVICES="cron metrics": the cron group reads the project crontab and the cron service's run history
  # (cron-run.sh's history.jsonl), both read-only.
  metrics:
    environment:
      METRICS_CRON: "1"
      # CRON_SCHEDULE=off: no job runs on schedule, so no run is expected.
      METRICS_CRON_SCHEDULE: ${CRON_SCHEDULE:-on}
    volumes:
      - type: bind
        source: ${PROJECT_DATA_DIRECTORY}/cron
        target: /host/cron-history
        read_only: true
      # Optional like the cron service's /etc/cron.d: project_mounts.py drops it when app/config/cron is missing.
      - type: bind
        source: ${PROJECT_CONFIG_DIRECTORY}/cron
        target: /host/cron-config
        read_only: true
