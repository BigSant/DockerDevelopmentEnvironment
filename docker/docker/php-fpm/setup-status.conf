; PHP 8.0+ only (the Dockerfile adds this file there; older php-fpm refuses the directive): the www pool's status
; on a listener of its own. php-fpm serves it from a hidden one-worker pool, so the metrics service gets the
; figures while every www worker is busy (the status request would otherwise wait in the queue it reports) and
; is not counted as an active worker itself. Reached over the metrics network like 9000; nothing publishes it.
[www]
pm.status_listen = 9001
