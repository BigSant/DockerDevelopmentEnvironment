; Setup's php-fpm master and pool settings for every PHP version (CORE image).
[global]
; make deploy reloads php-fpm (USR2) so OPcache serves the new code. Workers get this long to
; finish their current request before the master stops them; 0 (the default) would cut them off.
process_control_timeout = 30s

[www]
; One line per request. php-fpm points its own stdout at /dev/null, so start.sh keeps the container's stdout
; open as fd 3 and sets SETUP_FPM_ACCESS_LOG=/proc/self/fd/3: docker logs then keep requests (stdout) apart
; from PHP's messages and the master's notices (stderr). Started any other way, the image's default
; (/proc/self/fd/2, the official image's choice) applies. Besides the client (REMOTE_ADDR as Apache passes it),
; time, method, the URL the visitor asked for (REQUEST_URI, not the front controller) and the status: the
; request's time in milliseconds, PHP's peak memory in KB and the CPU share it used. "mili", not "milli":
; PHP before 8 accepts only that spelling, later versions both.
access.log = ${SETUP_FPM_ACCESS_LOG}
access.format = "%{REMOTE_ADDR}e - %u %t \"%m %{REQUEST_URI}e\" %s ms=%{mili}d kb=%{kilo}M cpu=%C%%"
; The pool's status (workers, queue, "max children reached") for the metrics service, which asks over FastCGI
; through the metrics network. Apache passes only existing .php files to php-fpm, so visitors never reach it.
pm.status_path = /setup-fpm-status
; PHP_FPM_SLOWLOG_SECONDS (0, off, by default): a request running longer gets its PHP stack trace on stderr. The
; master reads the worker's stack with ptrace, which the slowlog overlay grants (SYS_PTRACE) only when it is set.
request_slowlog_timeout = ${SETUP_FPM_SLOWLOG_TIMEOUT}
slowlog = /proc/self/fd/2
