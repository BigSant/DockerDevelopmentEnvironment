; Local dev PHP overrides — loaded ONLY in env-local (conf.d), prod/stage unaffected.
; Xdebug 3: always-on step debugging, lean — only `debug` mode (no coverage/profile/develop overhead).
zend_extension=xdebug.so
xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.connect_timeout_ms=50
xdebug.discover_client_host=0
xdebug.idekey=PHPSTORM
xdebug.max_nesting_level=512
xdebug.log_level=0

; OPcache: enabled for speed. Dev-safe — php.ini sets validate_timestamps=1 + revalidate_freq=0,
; so code edits are reflected immediately (no manual cache reset needed).
opcache.enable=1
