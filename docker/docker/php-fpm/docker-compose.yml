services:
  php-fpm-base:
    image: php-fpm-base-${IMAGE_ENV:-${ENV}}-${PHP_VERSION}-${XDEBUG_VERSION}-${COMPOSER_VERSION}${SETUP_IMAGE_SUFFIX:-}
    container_name: php-fpm-base-${ENV}-${PHP_VERSION}-${XDEBUG_VERSION}-${COMPOSER_VERSION}
    restart: unless-stopped
    build:
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/php-fpm/${PHP_VERSION}/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        PHP_VERSION: ${PHP_VERSION}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        APCU_VERSION: ${APCU_VERSION}
        PHPSTAN_PHAR_VERSION: ${PHPSTAN_PHAR_VERSION}
    profiles:
      - build_only
    networks:
      - network_app

  php-fpm:
    image: ${PROJECT_NAME}-php-fpm-${IMAGE_ENV:-${ENV}}${SETUP_IMAGE_SUFFIX:-}
    container_name: ${PROJECT_NAME}-${ENV}-php-fpm
    mem_limit: ${PHP_CONTAINER_MEMORY:-1g}
    cpus: ${CONTAINER_CPUS:-2}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    # Run as the host user so files written to the bind-mounted web dir are host-owned, not root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ${DOCKERFILE_DIRECTORY}
      dockerfile: ${DOCKERFILE_DIRECTORY}/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        ENV: ${BUILD_ENV:-${ENV}}
        SETUP_IMAGE_SUFFIX: ${SETUP_IMAGE_SUFFIX:-}
        PROFILE: ${PROFILE}
        PHP_VERSION: ${PHP_VERSION}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    entrypoint: ["/bin/sh", "/opt/setup/runtime/start.sh"]
    command: ["php-fpm", "-R"]
    environment:
      PROFILE: ${PROFILE-}
      CACHE_MODE: ${CACHE_MODE-}
      PHP_OPCACHE: ${PHP_OPCACHE-}
      PHP_APCU: ${PHP_APCU-}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS-}
      PHP_OPCACHE_REVALIDATE_FREQ: ${PHP_OPCACHE_REVALIDATE_FREQ-}
      PS_SMARTY_CACHE: ${PS_SMARTY_CACHE-}
      PS_SMARTY_COMPILE: ${PS_SMARTY_COMPILE-}
      PS_ASSET_CACHE: ${PS_ASSET_CACHE-}
      PS_OBJECT_CACHE: ${PS_OBJECT_CACHE-}
      MAIL_MODE: ${MAIL_MODE-}
      PS_DEBUG_MODE: ${PS_DEBUG_MODE-}
      PS_DEBUG_IPS: ${PS_DEBUG_IPS-}
      DATABASE_HOST: ${APP_DATABASE_HOST:-database}
      DATABASE_PORT: ${APP_DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME-}
      DATABASE_USER: ${DATABASE_USER-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-30}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-20M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-20M}
      # Per-project PHP overrides: default conf.d first, then project.d (always),
      # then project.d.env (ENV-match) — last wins.
      PHP_INI_SCAN_DIR: ":/opt/setup/runtime/php-policy:/usr/local/etc/php/project.d:/usr/local/etc/php/project.d.env"
    networks:
      - network_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${ROOT_DIRECTORY}/runtime/:/opt/setup/runtime/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/:/opt/setup/project/:ro
      - ${PROJECT_WEB_DIRECTORY}:/var/www/html/
      - ${PROJECT_DATA_DIRECTORY}/profiling/:/tmp/profiling/
      - ${PROJECT_DOCKER_DIRECTORY}/config/php/:/usr/local/etc/php/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/php/${ENV}/:/usr/local/etc/php/project.d.env/:ro
    healthcheck:
      # php (always present) probes the FastCGI port — no extra tooling needed.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 90s
