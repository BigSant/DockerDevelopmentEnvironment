services:
  php-fpm-base:
    image: php-fpm-base-${ENV}-${PHP_VERSION}-${XDEBUG_VERSION}-${COMPOSER_VERSION}
    container_name: php-fpm-base-${ENV}-${PHP_VERSION}-${XDEBUG_VERSION}-${COMPOSER_VERSION}
    restart: unless-stopped
    build:
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/php-fpm/${PHP_VERSION}/Dockerfile
      target: env-${ENV}
      args:
        PHP_VERSION: ${PHP_VERSION}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        APCU_VERSION: ${APCU_VERSION}
        PHPSTAN_PHAR_VERSION: ${PHPSTAN_PHAR_VERSION}
    profiles:
      - build_only
    networks:
      - network_app

  php-fpm:
    image: ${PROJECT_NAME}-php-fpm-${ENV}
    container_name: ${PROJECT_NAME}-${ENV}-php-fpm
    restart: unless-stopped
    # Run as the host user so files written to the bind-mounted web dir are host-owned, not root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ${DOCKERFILE_DIRECTORY}
      dockerfile: ${DOCKERFILE_DIRECTORY}/Dockerfile
      target: env-${ENV}
      args:
        ENV: ${ENV}
        PROFILE: ${PROFILE}
        PHP_VERSION: ${PHP_VERSION}
        XDEBUG_VERSION: ${XDEBUG_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-30}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-20M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-20M}
      # Per-project PHP overrides: default conf.d first, then project.d (always),
      # then project.d.env (ENV-match) — last wins.
      PHP_INI_SCAN_DIR: ":/usr/local/etc/php/project.d:/usr/local/etc/php/project.d.env"
    networks:
      - network_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROJECT_WEB_DIRECTORY}:/var/www/html/
      - ${PROJECT_DATA_DIRECTORY}/profiling/:/tmp/profiling/
      - ${PROJECT_DOCKER_DIRECTORY}/config/php/:/usr/local/etc/php/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/php/${ENV}/:/usr/local/etc/php/project.d.env/:ro
    healthcheck:
      # php (always present) probes the FastCGI port — no extra tooling needed.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
