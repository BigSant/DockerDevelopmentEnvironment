services:
  pma:
    image: pma-${IMAGE_ENV:-${ENV}}-${PMA_VERSION}${SETUP_IMAGE_SUFFIX_PMA:-}
    container_name: ${PROJECT_NAME}-${ENV}-pma-${PMA_VERSION}
    mem_limit: ${PMA_MEMORY}
    cpus: ${PMA_CPUS}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    build:
      labels:
        setup.managed: "1"
        setup.service: pma
        setup.fingerprint: ${SETUP_IMAGE_SUFFIX_PMA:-}
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/pma/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        PMA_VERSION: ${PMA_VERSION}
    environment:
      PMA_ABSOLUTE_URI: http://pma.${DOMAIN}
      PMA_HOST: database
      # Credentials injected at runtime — never baked into the shared pma image.
      PMA_USER: ${DATABASE_USER}
      PMA_PASSWORD: ${DATABASE_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - network_app
