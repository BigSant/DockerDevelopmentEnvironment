# Shared setup default: Redis as a cache on the project network (no published ports).
bind 0.0.0.0 ::
protected-mode no
dir /data
# No persistence unless a project drop-in enables it (e.g. "appendonly yes").
save ""
appendonly no
maxmemory-policy allkeys-lru
# Project drop-ins (rendered from config/redis and config/redis/<env>); later files win.
include /usr/local/etc/redis/project.r/*.conf
include /usr/local/etc/redis/project.r.env/*.conf
