services:
  database:
    image: mysql-${ENV}-${MYSQL_VERSION}
    container_name: ${PROJECT_NAME}-${ENV}-mysql-${MYSQL_VERSION}
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/mysql/Dockerfile
      target: env-${ENV}
      args:
        ENV: ${ENV}
        PROFILE: ${PROFILE}
        MYSQL_VERSION: ${MYSQL_VERSION}
    environment:
      MYSQL_HOST: ${DATABASE_HOST:-%}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - ${PROJECT_DATA_DIRECTORY}/mysql/:/var/lib/mysql
      - ${PROJECT_DOCKER_DIRECTORY}/config/mysql/:/etc/mysql/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/mysql/${ENV}/:/etc/mysql/project.d.env/:ro
    healthcheck:
      # Healthy only once the real server accepts TCP (not the skip-networking init server).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - network_app
