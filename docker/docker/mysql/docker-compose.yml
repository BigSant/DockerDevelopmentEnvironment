services:
  database:
    image: mysql-${IMAGE_ENV:-${ENV}}-${MYSQL_VERSION}${SETUP_IMAGE_SUFFIX_DATABASE:-}
    container_name: ${PROJECT_NAME}-${ENV}-mysql-${MYSQL_VERSION}
    mem_limit: ${DATABASE_MEMORY}
    cpus: ${DATABASE_CPUS}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    # Defaults to the host user (files in data/mysql stay host-owned for local dev). For
    # prod/stage, pin a fixed service account by setting DATABASE_UID/DATABASE_GID in the
    # project's .env.${ENV} — those win over the Makefile-injected HOST_UID/HOST_GID.
    user: "${DATABASE_UID:-${HOST_UID:-1000}}:${DATABASE_GID:-${HOST_GID:-1000}}"
    build:
      labels:
        setup.managed: "1"
        setup.service: database
        setup.fingerprint: ${SETUP_IMAGE_SUFFIX_DATABASE:-}
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/mysql/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        ENV: ${BUILD_ENV:-${ENV}}
        PROFILE: ${PROFILE}
        MYSQL_VERSION: ${MYSQL_VERSION}
    environment:
      TZ: ${TZ}
      # Available to project *.template drop-ins.
      SETUP_ENV: ${ENV}
      PROJECT_NAME: ${PROJECT_NAME}
      DOMAIN: ${DOMAIN}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_BUFFER_POOL: ${DATABASE_BUFFER_POOL}
      DATABASE_PERFORMANCE_SCHEMA: ${DATABASE_PERFORMANCE_SCHEMA:-off}
      MYSQL_HOST: ${DATABASE_HOST:-%}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD-}
      MYSQL_DATABASE: ${DATABASE_NAME}
      # Created and granted to MYSQL_USER on first start, like MYSQL_DATABASE (init.sh).
      DATABASE_EXTRA_SCHEMAS: ${DATABASE_EXTRA_SCHEMAS-}
    volumes:
      - ${PROJECT_DATA_DIRECTORY}/mysql/:/var/lib/mysql
      - ${PROJECT_DOCKER_DIRECTORY}/config/mysql/:/etc/mysql/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/mysql/${ENV}/:/etc/mysql/project.d.env/:ro
    healthcheck:
      # Healthy only once the real server accepts TCP (not the skip-networking init server).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - network_app
