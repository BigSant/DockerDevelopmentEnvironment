services:
  cron:
    image: ${PROJECT_NAME}-php-fpm-${IMAGE_ENV:-${ENV}}${SETUP_IMAGE_SUFFIX_PHP_FPM:-}
    container_name: ${PROJECT_NAME}-${ENV}-cron
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles:
      - cron
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sh /opt/setup/runtime/render-templates.sh /usr/local/etc/php/project.d /usr/local/etc/php/project.r /usr/local/etc/php/project.d.env /usr/local/etc/php/project.r.env
        : > /tmp/crontab
        for f in /etc/cron.d/crontab /etc/cron.d/crontab.${ENV}; do
          if [ -f "$$f" ]; then
            cat "$$f" >> /tmp/crontab
            echo "" >> /tmp/crontab
          fi
        done
        exec supercronic /tmp/crontab
    depends_on:
      php-fpm:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - network_app
    mem_limit: ${CRON_MEMORY}
    cpus: ${CRON_CPUS}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Xdebug 3 reads XDEBUG_MODE itself (debug | off | debug,profile ...); restart to apply.
      XDEBUG_MODE: ${XDEBUG_MODE}
      # Match php-fpm so cron jobs run PHP with the same per-project overrides.
      CACHE_MODE: ${CACHE_MODE-}
      PHP_OPCACHE: ${PHP_OPCACHE-}
      PHP_APCU: ${PHP_APCU-}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS-}
      PHP_OPCACHE_REVALIDATE_FREQ: ${PHP_OPCACHE_REVALIDATE_FREQ-}
      MAIL_MODE: ${MAIL_MODE-}
      # PrestaShop configuration file: version and shop keys (template + env).
      PS_VERSION: ${PS_VERSION-}
      PS_COOKIE_KEY: ${PS_COOKIE_KEY-}
      PS_COOKIE_IV: ${PS_COOKIE_IV-}
      PS_NEW_COOKIE_KEY: ${PS_NEW_COOKIE_KEY-}
      PS_SECRET: ${PS_SECRET-}
      PS_API_PRIVATE_KEY: ${PS_API_PRIVATE_KEY-}
      PS_API_PUBLIC_KEY: ${PS_API_PUBLIC_KEY-}
      PS_RIJNDAEL_KEY: ${PS_RIJNDAEL_KEY-}
      PS_RIJNDAEL_IV: ${PS_RIJNDAEL_IV-}
      PS_DATABASE_PREFIX: ${PS_DATABASE_PREFIX-}
      PS_LOCALE: ${PS_LOCALE-}
      PHP_INI_SCAN_DIR: ":/opt/setup/runtime/php-policy:/usr/local/etc/php/project.r:/usr/local/etc/php/project.r.env"
    volumes:
      - ${ROOT_DIRECTORY}/runtime/:/opt/setup/runtime/:ro
      - ${PROJECT_WEB_DIRECTORY}:/var/www/html
      - ${PROJECT_CONFIG_DIRECTORY}/cron:/etc/cron.d:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/php/:/usr/local/etc/php/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/php/${ENV}/:/usr/local/etc/php/project.d.env/:ro
