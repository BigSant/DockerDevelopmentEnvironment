services:
  php-doctrine-migrations:
    image: php-doctrine-migrations-${DOCTRINE_PHP_VERSION:-8.3}-${DOCTRINE_MIGRATIONS_VERSION}${SETUP_IMAGE_SUFFIX_PHP_DOCTRINE_MIGRATIONS:-}
    container_name: ${PROJECT_NAME}-${ENV}-php-doctrine-migrations-${DOCTRINE_PHP_VERSION:-8.3}-${DOCTRINE_MIGRATIONS_VERSION}
    restart: no
    entrypoint: ["tail", "-f", "/dev/null"]
    mem_limit: 512m
    build:
      labels:
        setup.managed: "1"
        setup.service: php-doctrine-migrations
        setup.fingerprint: ${SETUP_IMAGE_SUFFIX_PHP_DOCTRINE_MIGRATIONS:-}
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/php-doctrine-migrations/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        PHP_VERSION: ${DOCTRINE_PHP_VERSION:-8.3}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
        DOCTRINE_MIGRATIONS_VERSION: ${DOCTRINE_MIGRATIONS_VERSION}
    depends_on:
      - database
    networks:
      - network_app
    environment:
      DATABASE_HOST: database
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD-}
      DATABASE_NAME: ${DATABASE_NAME}
    volumes:
      - ${PROJECT_CONFIG_DIRECTORY}/doctrine-migrations/:/tmp/doctrine-migrations/config/
      - ${PROJECT_DATA_DIRECTORY}/doctrine-migrations/:/tmp/doctrine-migrations/cache/
