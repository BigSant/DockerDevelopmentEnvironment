services:
  database:
    image: mariadb-${IMAGE_ENV:-${ENV}}-${MARIADB_VERSION}${SETUP_IMAGE_SUFFIX_DATABASE:-}
    container_name: ${PROJECT_NAME}-${ENV}-mariadb-${MARIADB_VERSION}
    mem_limit: ${DATABASE_MEMORY}
    cpus: ${DATABASE_CPUS}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    # Run as the host user so data/files are host-owned, not root (mirrors mysql).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      labels:
        setup.managed: "1"
        setup.service: database
        setup.fingerprint: ${SETUP_IMAGE_SUFFIX_DATABASE:-}
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/mariadb/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        ENV: ${BUILD_ENV:-${ENV}}
        PROFILE: ${PROFILE}
        MARIADB_VERSION: ${MARIADB_VERSION}
    environment:
      TZ: ${TZ}
      # Available to project *.template drop-ins.
      SETUP_ENV: ${ENV}
      PROJECT_NAME: ${PROJECT_NAME}
      DOMAIN: ${DOMAIN}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_BUFFER_POOL: ${DATABASE_BUFFER_POOL}
      DATABASE_PERFORMANCE_SCHEMA: ${DATABASE_PERFORMANCE_SCHEMA:-off}
      MYSQL_ROOT_HOST: ${DATABASE_HOST:-%}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD-}
      MYSQL_DATABASE: ${DATABASE_NAME}
      # Created and granted to MYSQL_USER on first start, like MYSQL_DATABASE (init.sh).
      DATABASE_EXTRA_SCHEMAS: ${DATABASE_EXTRA_SCHEMAS-}
    volumes:
      - ${PROJECT_DATA_DIRECTORY}/mariadb/:/var/lib/mysql
      - ${PROJECT_DOCKER_DIRECTORY}/config/mariadb/:/etc/mysql/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/mariadb/${ENV}/:/etc/mysql/project.d.env/:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - network_app
