services:
  database:
    image: mariadb-${IMAGE_ENV:-${ENV}}-${MARIADB_VERSION}${SETUP_IMAGE_SUFFIX:-}
    container_name: ${PROJECT_NAME}-${ENV}-mariadb-${MARIADB_VERSION}
    mem_limit: ${DB_CONTAINER_MEMORY:-2g}
    cpus: ${CONTAINER_CPUS:-2}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    # Run as the host user so data/files are host-owned, not root (mirrors mysql).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ${ROOT_DIRECTORY}
      dockerfile: ${ROOT_DIRECTORY}/docker/mariadb/Dockerfile
      target: env-${BUILD_ENV:-${ENV}}
      args:
        ENV: ${BUILD_ENV:-${ENV}}
        PROFILE: ${PROFILE}
        MARIADB_VERSION: ${MARIADB_VERSION}
    environment:
      MYSQL_ROOT_HOST: ${DATABASE_HOST:-%}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - ${PROJECT_DATA_DIRECTORY}/mariadb/:/var/lib/mysql
      - ${PROJECT_DOCKER_DIRECTORY}/config/mariadb/:/etc/mysql/project.d/:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/mariadb/${ENV}/:/etc/mysql/project.d.env/:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - network_app
