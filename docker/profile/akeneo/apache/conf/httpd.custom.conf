# Akeneo-specific Apache config — loaded via IncludeOptional, after the base
# httpd.custom.conf. Active only when PROFILE=akeneo.
#
# Akeneo is a Symfony application: the document root is typically `public/` and all
# requests fall back to the front controller (index.php). Configure that routing here
# (DOCUMENT_ROOT is set per-project via the DOCUMENT_ROOT env var / apache init.sh).

# Example — Symfony front-controller fallback:
#<Directory /var/www/html>
#    FallbackResource /index.php
#</Directory>
