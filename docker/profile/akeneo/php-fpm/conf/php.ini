; Akeneo-specific PHP overlay — loaded as conf.d/zz-profile.ini (overrides php.ini).
; Active only when PROFILE=akeneo.
;
; Akeneo PIM needs far more PHP resources than the defaults. Uncomment / tune per
; Akeneo version requirements:
;memory_limit = 1024M         ; Akeneo jobs/imports; CLI workers may need more (or -1)
;max_execution_time = 600     ; long-running batch jobs
;max_input_vars = 20000       ; large product / attribute forms
;
; FPM pool tuning can go in a sibling pool.conf (loaded as php-fpm.d/zz-profile.conf).
