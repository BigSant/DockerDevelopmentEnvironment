; PrestaShop-specific PHP overlay — loaded as conf.d/zz-profile.ini (overrides php.ini).
; Active only when PROFILE=prestashop.
;
; The base php.ini already covers PrestaShop's needs (max_input_vars=20000,
; memory_limit=512M, allow_url_fopen=On). Add PrestaShop-specific overrides here, e.g.:
;max_execution_time = 300         ; long BO operations (module install, big imports)
;mysqli.allow_local_infile = On   ; some import modules use LOAD DATA LOCAL INFILE
;
; FPM pool tuning can go in a sibling pool.conf (loaded as php-fpm.d/zz-profile.conf).
