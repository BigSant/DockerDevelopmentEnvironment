# PrestaShop-specific Apache config — loaded via IncludeOptional, after the base
# httpd.custom.conf so it can extend/override it. Active only when PROFILE=prestashop.
#
# PrestaShop ships its own .htaccess and the vhost uses `AllowOverride All`, so most
# rewrite/security rules come from the app itself. Add server-level PrestaShop
# overrides here (e.g. custom admin-dir handling, extra deny rules, DirectoryIndex).

# Example — match the PrestaShop front controller as the directory index:
#DirectoryIndex index.php index.html
