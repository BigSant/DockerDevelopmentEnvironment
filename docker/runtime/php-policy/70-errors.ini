; PHP's own messages (warnings, fatal errors) go to stderr as PHP formats them, with their time:
; "[15-Oct-2026 10:28:02 Europe/Vilnius] PHP Warning:  ...". php-fpm hands a worker's stderr to the master,
; which writes the line to docker logs, where the log collector and the metrics HTTP group read it.
; Without it php-fpm passes the message as "NOTICE: PHP message: ..." without a time.
error_log = /proc/self/fd/2
