name: Setup compatibility
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
      - run: docker build -t setup-pma-access-test --build-arg NGINX_VERSION=1.26.0 --target env-local -f docker/docker/nginx-proxy/Dockerfile docker
      - run: python3 -m unittest discover -s tests -p 'test_pma_access_integration.py' -v
        env:
          SETUP_NGINX_TEST_IMAGE: setup-pma-access-test
      - run: docker pull redis:7.4-alpine
      - run: python3 -m unittest discover -s tests -p 'test_redis_integration.py' -v
        env:
          SETUP_REDIS_TEST_IMAGE: redis:7.4-alpine
  php-config:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker pull "php:${PHP_VERSION}-cli"
        env:
          PHP_VERSION: '${{ matrix.php }}'
      - run: python3 -m unittest discover -s tests -p 'test_runtime*.py' -v
        env:
          PHP_TEST_IMAGE: 'php:${{ matrix.php }}-cli'
  php-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tests/build_php_image.py "tests/fixtures/php-images/${PHP_BRANCH}.env"
        env:
          PHP_BRANCH: '${{ matrix.php }}'
      - run: python3 -m unittest discover -s tests -p 'test_php_image_integration.py' -v
        env:
          SETUP_PHP_TEST_IMAGE: setup-php-image-test
  database:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:5.7', 'mysql:8.4', 'mariadb:11.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker pull "$SETUP_DB_TEST_IMAGE"
        env:
          SETUP_DB_TEST_IMAGE: '${{ matrix.image }}'
      - run: docker build -t setup-php-policy-test -f tests/fixtures/php-policy.Dockerfile .
      - run: docker build -t setup-doctrine-diff-test --build-arg PHP_VERSION=8.3 --build-arg COMPOSER_VERSION=2.7.6 --build-arg DOCTRINE_MIGRATIONS_VERSION=3.8 -f docker/docker/php-doctrine-migrations/Dockerfile docker
      - run: python3 -m unittest discover -s tests -p 'test_database_*integration.py' -v
        env:
          SETUP_DB_TEST_IMAGE: '${{ matrix.image }}'
          SETUP_MYSQL_FIXTURES_INTEGRATION: '1'
          SETUP_MYSQL_SCHEMA_INTEGRATION: '1'
          SETUP_PHP_DB_TEST_IMAGE: setup-php-policy-test
          SETUP_DOCTRINE_TEST_IMAGE: setup-doctrine-diff-test
