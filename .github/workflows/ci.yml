name: Setup compatibility
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: [self-hosted, linux, setup.build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: tests/run --verbose
      - run: docker build -t setup-web-access-test --build-arg NGINX_VERSION=1.30.5 --target env-local -f docker/docker/nginx-proxy/Dockerfile docker
      - run: python3 -m unittest discover -s tests -p 'test_web_access_integration.py' -v
        env:
          SETUP_NGINX_TEST_IMAGE: setup-web-access-test
      - run: docker build -t setup-apache-test --build-arg APACHE_VERSION=2.4.59 --target env-local -f docker/docker/apache/Dockerfile docker
      - run: python3 -m unittest discover -s tests -p 'test_webserver_security_integration.py' -v
        env:
          SETUP_APACHE_TEST_IMAGE: setup-apache-test
          SETUP_NGINX_TEST_IMAGE: setup-web-access-test
      - run: docker build -t setup-mysql-test --build-arg MYSQL_VERSION=8.4.0 --target env-local -f docker/docker/mysql/Dockerfile docker
      - run: python3 -m unittest discover -s tests -p 'test_database_project_init_integration.py' -v
        env:
          SETUP_MYSQL_IMAGE: setup-mysql-test
      - run: docker build -t setup-redis-test --build-arg REDIS_VERSION=7.4 --target env-local -f docker/docker/redis/Dockerfile docker
      - run: python3 -m unittest discover -s tests -p 'test_redis_integration.py' -v
        env:
          SETUP_REDIS_TEST_IMAGE: setup-redis-test
  php-config:
    runs-on: [self-hosted, linux, setup.build]
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker pull "php:${PHP_VERSION}-cli"
        env:
          PHP_VERSION: '${{ matrix.php }}'
      - run: python3 -m unittest discover -s tests -p 'test_runtime*.py' -v
        env:
          PHP_TEST_IMAGE: 'php:${{ matrix.php }}-cli'
  php-images:
    runs-on: [self-hosted, linux, setup.build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 tests/build_php_image.py "tests/fixtures/php-images/${PHP_BRANCH}.env"
        env:
          PHP_BRANCH: '${{ matrix.php }}'
      - run: python3 -m unittest discover -s tests -p 'test_php_image_integration.py' -v
        env:
          SETUP_PHP_TEST_IMAGE: setup-php-image-test
  database:
    runs-on: [self-hosted, linux, setup.build]
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:5.7', 'mysql:8.4', 'mariadb:11.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pulls the server, builds setup's image of the same version and the PHP policy/Doctrine images,
      # and sets every variable the database B tests read (tests/run --help).
      - run: tests/run --verbose --database '${{ matrix.image }}'
  release:
    runs-on: [self-hosted, linux, setup.build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # make deploy-images into a throwaway Docker daemon (docker:27-dind) standing in for the server.
      - run: tests/run --verbose --release
