name: Release
# Every merge to master becomes a release once its CI passed: tools/release.py moves VERSION and doc/RELEASES.md,
# then "Release X.Y.Z" is committed and tagged vX.Y.Z. The newest release tag is therefore always master, and a
# server that takes the newest release (setup-server: update-setup) runs what master has. Prod releases build from
# a release tag only, so they never wait for a hand-made release.
on:
  workflow_run:
    workflows: [Setup compatibility]
    types: [completed]
    branches: [master]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
      - name: Release the tested commit while it is master's newest
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          # Only the commit CI tested: when master moved on, the newer commit's own run releases it.
          if [ "$head" != "$TESTED" ]; then echo "master is at $head, not the tested $TESTED: its own run releases it"; exit 0; fi
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then echo "$head is already $tag"; exit 0; fi
          case "$(git log -1 --format=%s)" in "Release "*) echo "$head is a release commit"; exit 0 ;; esac
          version=$(python3 tools/release.py)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Release $version" -m "Automatic release of $TESTED, whose CI passed (tools/release.py)."
          git tag "v$version"
          # Refused when master moved meanwhile: that commit's run releases it.
          # Local machines fetch deploy/local, never an untested master commit. Publish the release,
          # its tag and the approved channel together; a concurrent master push rejects all three.
          git push --atomic origin "HEAD:refs/heads/master" "refs/tags/v$version" "HEAD:refs/heads/deploy/local"
          echo "Released v$version"
  local-update:
    name: Update and verify the local environment
    needs: release
    runs-on: [self-hosted, linux, setup.build]
    timeout-minutes: 55
    permissions:
      contents: read
    concurrency:
      group: local-environment-update
      cancel-in-progress: false
    steps:
      - name: Apply the CI-approved versions on this worker
        env:
          EXPECTED_COMPONENT: setup
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sudo -n systemctl start setup-server-auto-update.service
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          state = json.loads((Path(os.environ['SETUP_SERVER_ROOT']) / 'auto-update/status.json').read_text())
          if state.get('result') not in ('updated', 'up_to_date'):
              raise SystemExit('Local update did not succeed; inspect the service journal')
          heads = {}
          for side, directory in state['paths'].items():
              def git(*arguments):
                  return subprocess.check_output(['git', '-C', directory, *arguments], text=True).strip()
              head = git('rev-parse', 'HEAD')
              if head != state['targets'][side] or head != git('rev-parse', 'refs/remotes/origin/deploy/local'):
                  raise SystemExit(side + ': local checkout is not the current CI-approved commit')
              if git('status', '--porcelain', '--untracked-files=normal'):
                  raise SystemExit(side + ': local edits appeared; deployment verification stopped')
              heads[side] = head
          component = os.environ['EXPECTED_COMPONENT']
          subprocess.run(['git', '-C', state['paths'][component], 'merge-base', '--is-ancestor',
                          os.environ['EXPECTED_COMMIT'], heads[component]], check=True)
          print('Local checkouts, health checks and installed server refresh succeeded:', heads)
          PY
