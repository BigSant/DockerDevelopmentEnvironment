# Optional: add redis to PROFILES when the application is configured to use it.
services:
  redis:
    image: redis:${REDIS_VERSION}-alpine
    profiles: [redis]
    mem_limit: ${REDIS_CONTAINER_MEMORY:-512m}
    cpus: ${CONTAINER_CPUS:-2}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    networks: [network_app]
    volumes:
      - ${PROJECT_DATA_DIRECTORY}/redis:/data
      - ${PROJECT_DOCKER_DIRECTORY}/config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ${PROJECT_DOCKER_DIRECTORY}/config/redis/${ENV}:/usr/local/etc/redis/environment:ro
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5
